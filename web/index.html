<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sythix Client</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #08070b; --panel: rgba(16, 14, 20, 0.78); --edge: rgba(255, 255, 255, 0.08); --text: #ece9f1; --muted: #9b96a6; --red: #d81820; --ember: #ff7a3d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Poppins", system-ui, sans-serif; overflow: hidden; }
  #display { position: fixed; inset: 0; display: none; }
  #display canvas { outline: none; }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% 110%, rgba(216, 24, 32, 0.28), transparent 60%), radial-gradient(900px 500px at 15% -10%, rgba(255, 122, 61, 0.10), transparent 60%), var(--bg); }
  .card { width: min(440px, calc(100% - 32px)); padding: 32px 28px; border-radius: 18px; background: var(--panel); border: 1px solid var(--edge);
    backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); text-align: center; }
  .card img { width: 120px; height: 120px; image-rendering: pixelated; filter: drop-shadow(0 0 28px rgba(216, 24, 32, 0.45)); }
  h1 { margin: 10px 0 2px; font-size: 26px; letter-spacing: 0.04em; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  button { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.10); cursor: pointer; font: inherit; font-size: 16px; color: #fff;
    background: linear-gradient(90deg, var(--red), var(--ember)); box-shadow: 0 8px 26px rgba(216, 24, 32, 0.35); transition: transform 0.15s ease, filter 0.15s ease; }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin: 18px 0 8px; display: none; }
  .bar > div { height: 100%; width: 30%; background: linear-gradient(90deg, var(--red), var(--ember)); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  #status { color: var(--muted); font-size: 13px; min-height: 18px; }
  #status.error { color: #ffb4b4; text-align: left; background: rgba(216, 24, 32, 0.12); border: 1px solid rgba(216, 24, 32, 0.4); border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.45; }
  #status.error b { display: block; color: #fff; margin-bottom: 4px; }
  .fine { margin-top: 18px; color: #6f6a79; font-size: 11.5px; line-height: 1.5; }
  .fine a { color: #a39dad; }
  details { text-align: left; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; margin-bottom: 8px; }
  .field { display: block; margin: 8px 0 0; }
  .field span { display: block; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--edge); background: rgba(0, 0, 0, 0.35); color: var(--text); font: inherit; font-size: 13px; }
  #loading { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(900px 500px at 50% 120%, rgba(216, 24, 32, 0.22), transparent 60%), linear-gradient(#16161b, #0b0b0e); transition: opacity 0.3s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading.placed img, #loading.placed .track, #loading.placed .step { position: absolute; transition: left 0.6s ease, top 0.6s ease, width 0.6s ease, height 0.6s ease; }
  #loading.placed img { animation: none; filter: none; }
  #loading.placed .step { left: 0; right: 0; text-align: center; }
  #loading img { width: min(220px, 40vh); height: auto; animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 18px rgba(216, 24, 32, 0.35)); } 50% { filter: drop-shadow(0 0 34px rgba(255, 122, 61, 0.55)); } }
  #loading .track { width: min(320px, calc(100% - 64px)); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  #loading .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--ember)); box-shadow: 0 0 12px rgba(255, 122, 61, 0.6); }
  #loading .step { color: var(--muted); font-size: 13px; min-height: 18px; }
  @media (prefers-reduced-motion: reduce) { #loading img { animation: none; } }
  label { display: flex; gap: 8px; align-items: flex-start; text-align: left; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
</style>
</head>
<body>
<div class="screen" id="start">
  <div class="card">
    <img src="logo.png" alt="Sythix logo">
    <h1>Sythix Client</h1>
    <p class="sub">Minecraft 1.12 &middot; browser edition</p>
    <noscript><p class="sub">JavaScript is needed to run the game.</p></noscript>
    <label><input type="checkbox" id="eula"> I own Minecraft and accept the <a href="https://www.minecraft.net/eula" target="_blank" rel="noopener">Minecraft EULA</a>.</label>
    <details id="options">
      <summary>Multiplayer and speed</summary>
      <label class="field"><span>Multiplayer proxy (needed to join servers from a browser)</span><input id="proxy" placeholder="wss://proxy.example.com" spellcheck="false" autocomplete="off"></label>
      <label class="field"><span>Join a server right away (optional)</span><input id="server" placeholder="play.example.com" spellcheck="false" autocomplete="off"></label>
      <label style="margin: 12px 0 0;"><input type="checkbox" id="fullscreen"> Fullscreen (F11 also works; Esc leaves it)</label>
      <label class="field"><span>Resolution (lower is faster on weak computers)</span><select id="scale"><option value="1">Full</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label>
    </details>
    <button id="play" disabled>Play</button>
    <div class="bar" id="bar"><div></div></div>
    <div id="status"></div>
    <div class="fine">
      Runs in your browser with <a href="https://cheerpj.com" target="_blank" rel="noopener">CheerpJ</a> (Java in WebAssembly).
      The first start downloads about 30&nbsp;MB and takes a minute; your worlds and settings are saved in this browser.
      Not an official Minecraft product.
    </div>
  </div>
</div>
<div id="display"></div>
<div id="loading" aria-live="polite">
  <img src="logo.png" alt="Sythix Client">
  <div class="track"><div class="fill" id="loading-fill"></div></div>
  <div class="step" id="loading-step">Starting...</div>
</div>
<script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
<script type="module" src="sythix-web.js"></script>
</body>
</html>
